<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Fluxo</title>
    <link rel="stylesheet" href="style_cadastro.css">
</head>
<body>

    <header>

        <nav>

            <a href="#">Cadastro</a>
            <a href="#" class="pagina-atual">Login</a>
            <a href="#">Sobre</a>

        </nav>
        
    </header>

    <main>

        <section class="login">

            <h1>Bem vindo de volta!</h1>

            <form>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit">Entrar</button>

            </form>

            <p class="cadastro">
                É novo por aqui?
                <a href="#">Faça o cadastro!</a>
            </p>

        </section>

        <section class="dashboard">

            <div class="grafico grafico-rosca">
                <div class="titulo-grafico">
                    <span class="ponto"></span>
                    <div class="linha-titulo"></div>
                    <span class="opcoes">•••</span>
                </div>

                <div class="conteudo-rosca">
                    <div class="rosca"></div>

                    <div class="legenda">
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                        <div></div>
                    </div>
                </div>
            </div>

            <div class="grafico grafico-barras">
                <div class="titulo-grafico">
                    <span class="ponto"></span>
                    <div class="linha-titulo"></div>
                    <span class="opcoes">•••</span>
                </div>

                <div class="barras">
                    <div class="barra" style="height: 30%;"></div>
                    <div class="barra" style="height: 42%;"></div>
                    <div class="barra" style="height: 57%;"></div>
                    <div class="barra" style="height: 65%;"></div>
                    <div class="barra" style="height: 80%;"></div>
                    <div class="barra" style="height: 100%;"></div>
                </div>
            </div>

            <div class="grafico grafico-linha">
                <div class="titulo-grafico">
                    <span class="ponto"></span>
                    <div class="linha-titulo"></div>
                    <span class="opcoes">•••</span>
                </div>

                <div class="grafico-linha-conteudo">
                    <div class="ponto-grafico p1"></div>
                    <div class="ponto-grafico p2"></div>
                    <div class="ponto-grafico p3"></div>
                    <div class="ponto-grafico p4"></div>
                    <div class="ponto-grafico p5"></div>
                    <div class="ponto-grafico p6"></div>
                    <div class="ponto-grafico p7"></div>
                </div>
            </div>

            <div class="grafico grafico-lista">
                <div class="titulo-grafico">
                    <span class="ponto"></span>
                    <div class="linha-titulo"></div>
                    <span class="opcoes">•••</span>
                </div>

                <div class="item-lista">
                    <div class="foto foto1"></div>
                    <div class="barra-lista"><span style="width: 65%;"></span></div>
                </div>

                <div class="item-lista">
                    <div class="foto foto2"></div>
                    <div class="barra-lista"><span style="width: 45%;"></span></div>
                </div>

                <div class="item-lista">
                    <div class="foto foto3"></div>
                    <div class="barra-lista"><span style="width: 75%;"></span></div>
                </div>

                <div class="item-lista">
                    <div class="foto foto4"></div>
                    <div class="barra-lista"><span style="width: 35%;"></span></div>
                </div>
            </div>

        </section>

    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Topfy</title>
    <link rel="stylesheet" href="style_login.css">
</head>
<body>

    <div class="tela">

        <div class="login_esquerda">
            
            <p>Bem vindo de volta!</p>

            <div class="email">

                <label for="e-mail">E-mail</label>
                <input type="text" id="e-mail" placeholder="Digite seu e-mail">

            </div>

            <div class="senha">

                <label for="">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha">

            </div>

            <div class="botao_login">

                <button>Login</button>

            </div>

            <span>É novo por aqui? <a href="">Faça seu cadastro.</a></span>

        </div>

        <div class="institucional_direita">
            
            <nav>

                <a href="home.html">Home</a>

                <a>Sobre</a>

                <a>Cadastro</a>

            </nav>

            <div class="logo">

                <img src="imagens/logotopfywbg.png" alt="">

            </div>



        </div>

    </div>
    
    


</body>
</html>

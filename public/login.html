<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Topfy</title>
    <link rel="stylesheet" href="style_login.css">
    <script src="./js/sessao.js"></script>
</head>
<body>

    <div class="tela">

        <div class="login_esquerda">
            
            <p>Bem vindo de volta!</p>

            <div class="email">

                <label for="e-mail">E-mail</label>
                <input type="text" id="e-mail" placeholder="Digite seu e-mail">

            </div>

            <div class="senha">

                <label for="">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha">

            </div>

            <div class="botao_login">

                <button>Login</button>

            </div>

            <span>É novo por aqui? <a href="cadastro.html"><b>Faça seu cadastro!</b></a></span>

        </div>

        <div class="institucional_direita">
            
            <nav>

                <a href="home.html">Home</a>

                <a href="home.html#sobre">Sobre</a>

                <a href="cadastro.html">Cadastro</a>

            </nav>

            <div class="logo">

                <img src="imagens/logotopfywbg.png" alt="">

            </div>



        </div>

    </div>
    
    


</body>
</html>
<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>

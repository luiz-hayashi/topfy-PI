<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist - Topfy</title>
    <link rel="stylesheet" href="css/tela_playlist.css">
    <script src="./js/sessao.js"></script>
</head>

<body>
<body onload="validarSessao()">

    <div class="conteudo">

        <nav>

            <div class="logo_navbar">

                <img src="imagens/logotopfywbg.png" alt="" onclick="limparSessao()">

            </div>

            <div class="elemento_playlist">

                <p><a href="">Playlist</a></p>

            </div>

            <div class="elemento_dashboard">

                <p><a href="tela_dashboard.html">Dashboard</a></p>

            </div>

            <div class="elemento_quiz">

                <p><a href="tela_quiz.html">Quiz</a></p>

            </div>

            <div class="elemento_usuario">

                <p id="b_usuario">usuário</p> <img src="imagens/ícone_usuario_tela_playlist.png" alt="">

            </div>

        </nav>

        <div class="conteudo-pagina">

            <div class="texto_sua_playlist">

                <p>Sua playlist</p>

            </div>

            <div class="quadro_playlist">

                <div id="estado_vazio" class="estado_vazio">

                    <div class="disco_quebrado_transparente">

                        <img src="imagens/disco_quebrado_transparente.png" alt="">

                    </div>

                    <p>Você ainda não adicionou nada</p>

                    <span>Vamos ouvir algo?</span>

                </div>

                <div class="cards_musicas_playlist" id="cards_musicas_playlist"></div>

                <div class="campo_buscar_musica">

                    <input oninput="buscarMusica()" id="input_busca_musica" type="text">

                    <ul id="popup_busca_musica"></ul>

                </div>

            </div>

        </div>

    </div>





</body>
</html>
<script>
    
    // alguns elementos da tela que eu vou precisar gravar como variável pois o javascript vai precisar manusear

    const inputBusca = document.getElementById("input_busca_musica")
    const popupBusca = document.getElementById("popup_busca_musica")
    const containerCards = document.getElementById("cards_musicas_playlist")
    const estadoVazio = document.getElementById("estado_vazio")

    let temporizador

    let listaMusicas = []


    // aqui acontece a requisição para a API da Deezer
    // eu primeiro faço um trim, e lowercase para limpar a busca do usuário
    // o cleartimeout serve para resetar a latência de 400ms caso o usuário volte a digitar antes que o
    // o temporizador chegue ao fim

    // quando a input tem mais de 2 caracteres, a requisição ao endpoint da Deezer acontece

    function buscarMusica() {

        const texto = inputBusca.value.trim().toLowerCase()

        clearTimeout(temporizador)

        if (texto.length < 2) {

            popupBusca.style.display = "none"
            return

        }

        // aqui tem um "buscando artificial", que na verdade só está esperando a requisição chegar após o timeout

        popupBusca.style.display = "block"
        popupBusca.innerHTML = "<li>Buscando...</li>"

        temporizador = setTimeout(function () {

            fetch("/deezer/buscar?q=" + encodeURIComponent(texto)) // promise de que vai entregar o resultado da busca

                .then(function (resposta) {

                    if (!resposta.ok) throw new Error("Erro na busca.")
                    return resposta.json()

                    // caso a resposta seja um erro de HTTP, e não um erro do promise.
                    // é quando uma resposta de fato de chega/resolvida, mas não é o promise esperado
                })

                .then(function (musicas) {

                    listaMusicas = musicas
                    popupBusca.innerHTML = ""

                    if (musicas.length == 0) {

                        popupBusca.textContent = "Nenhuma música ou artista encontrado."
                        return

                        // se a lista não retornar nenhuma música, é porque não tem nenhuma mesmo

                    }

                    // aqui os cards são desenhados a medida que a gente percorre o array de musicas

                    for (let i = 0; i < musicas.length; i++) {

                        popupBusca.innerHTML += 
                        `<li onclick="mostrar(${i})"><img src="${musicas[i].capa}">${musicas[i].musica} - ${musicas[i].artista}</li>`;

                    }

                })

                .catch(function (erro) {

                    console.log(erro)
                    popupBusca.textContent = "Não foi possível realizar a busca."

                })

        }, 400)

    }


    // através dessa função, a o disco quebrado some quando a gente clica em uma música
    // e ainda na mesma função, ela some com o popup de busca, e com o input, quando seleciona uma música

    function mostrar(indice) {

        const musica = listaMusicas[indice]

        if (!musica) return;

        estadoVazio.style.display = "none"

        criarCard(musica, null, null);

        popupBusca.style.display = "none"
        inputBusca.value = ""

    }


    // aqui é onde se desenha os cards das músicas selecionadas

    function criarCard(musica, idBanco, genero) {

        const card = document.createElement("div")
        card.className = "card_musica"

        if (idBanco != null) {
            card.dataset.id = idBanco
        }

        card.innerHTML = 
        `
        <div class="linha_musica">

            <img src="${musica.capa}" alt="Capa de ${musica.musica}">

            <div class="info_musica">

                <div class="nome">${musica.musica}</div>

                <div class="artista">${musica.artista}</div>

            </div>

            <button class="btn_genero">Adicionar gênero</button>

            <input type="text" class="input_genero"
            placeholder="Digite o gênero..." style="display:none;">

            <button class="btn_remover" title="Remover">×</button>

            <button class="btn_dropdown" title="Opções">▼</button>

        </div>

        <div class="player_deezer" style="display: none;"></div>
`;

        containerCards.appendChild(card);

        const botaoDropdown = card.querySelector(".btn_dropdown")
        const playerDeezer = card.querySelector(".player_deezer")

        const idDeezer = String(musica.id_musica || "")

        if (botaoDropdown && /^\d+$/.test(idDeezer)) {

            botaoDropdown.onclick = function () {

                if (playerDeezer.style.display === "none") {

                    if (!playerDeezer.querySelector("iframe")) {

                        const iframe = document.createElement("iframe")

                        iframe.src = "https://widget.deezer.com/widget/dark/track/" + idDeezer

                        iframe.width = "100%"
                        iframe.height = "150"
                        iframe.allow = "encrypted-media; clipboard-write"
                        iframe.allowFullscreen = true

                        playerDeezer.appendChild(iframe)

                    }

                    playerDeezer.style.display = "block"
                    botaoDropdown.innerHTML = "▲"

                } else {

                    playerDeezer.innerHTML = ""
                    playerDeezer.style.display = "none"
                    botaoDropdown.innerHTML = "▼"

                }

            }

        }

        const botaoGenero = card.querySelector(".btn_genero")
        const inputGenero = card.querySelector(".input_genero")

        if (genero) {
            botaoGenero.textContent = genero
            inputGenero.value = genero
        }

        // ABRIR CAMPO DE GÊNERO

        botaoGenero.onclick = function () {
            botaoGenero.style.display = "none";
            inputGenero.style.display = "inline-block";
            inputGenero.focus()
        };

        // SALVAR AO PRESSIONAR ENTER OU SAIR DO CAMPO

        inputGenero.onkeydown = function (evento) {
            if (evento.key == "Enter") {
                inputGenero.blur()
            }
        };

        inputGenero.onblur = function () {
            salvarGenero(musica, card, botaoGenero, inputGenero);
        };

        // REMOVER MÚSICA

        card.querySelector(".btn_remover").onclick = function () {
            removerCard(card)
        };

    }


    // SALVAR GÊNERO E MÚSICA NO BANCO

    function salvarGenero(musica, card, botaoGenero, inputGenero) {

        const genero = inputGenero.value.trim();
        const idUsuario = sessionStorage.ID_USUARIO;
        const idBanco = card.dataset.id

        if (!genero) {
            botaoGenero.style.display = "inline-block";
            inputGenero.style.display = "none";
            return;
        }

        if (!idUsuario) {
            console.log("Usuário não está logado.");
            botaoGenero.style.display = "inline-block";
            inputGenero.style.display = "none";
            return;
        }

        botaoGenero.disabled = true;

        // se a música já existe, com o gênero, e tudo cadastrado, é feito a alteração do gênero dela

        if (idBanco) {

            fetch("/musica/atualizar-genero/" + idBanco, {

                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({genero: genero})

            })

            .then(function (resposta) {

    console.log("Status:", resposta.status);

    return resposta.text().then(function (dados) {

        console.log("Resposta do servidor:", dados);

        if (!resposta.ok) {
            throw new Error(dados);
        }

        return JSON.parse(dados);

    });

})
            
            .then (function (dados) {

                if (!dados.sucesso) {

                    throw new Error("Não foi possível atualizar o gênero") 

                }

                botaoGenero.textContent = genero
                inputGenero.style.display = "none"
                botaoGenero.style.display = "inline-block"
                botaoGenero.disabled = false;
            
            })

            .catch (function (erro) {

                console.log(erro)
                botaoGenero.style.display = "inline-block"
                botaoGenero.disabled = false
                inputGenero.style.display = "none"

            })

            return

        }

        // se a música é nova, e não existe no banco de dados ainda, é feito o cadastro da mesma

        fetch("/musica/cadastrar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                musica: musica.musica,
                artista: musica.artista,
                genero: genero,
                id_musica: musica.id_musica,
                id_artista: musica.id_artista,
                capa: musica.capa,
                foto_artista: musica.foto_artista
            })
        })

            .then(function (resposta) {
                if (!resposta.ok) throw new Error("Erro ao cadastrar música.");
                return resposta.json();
            })

            .then(function (dados) {

                if (!dados || !dados.sucesso) {
                    throw new Error("Não foi possível cadastrar a música.");
                }

                card.dataset.id = dados.id;

                return fetch("/musica/associar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        fk_usuario: idUsuario,
                        fk_musica: dados.id
                    })
                });

            })

            .then(function (resposta) {
                if (!resposta.ok) throw new Error("Erro ao associar música.");
                return resposta.json();
            })

            .then(function () {
                inputGenero.style.display = "none";
                botaoGenero.textContent = genero;
                botaoGenero.style.display = "inline-block";
                botaoGenero.disabled = false;
            })

            .catch(function (erro) {
                console.log(erro);
                botaoGenero.disabled = false;
                botaoGenero.style.display = "inline-block";
                inputGenero.style.display = "none";
            });

    }


    // REMOVER MÚSICA

    function removerCard(card) {

        const idBanco = card.dataset.id;

        // Se ainda não foi salva, remove apenas da tela.

        if (!idBanco) {
            tirarDaTela(card);
            return;
        }

        fetch("/musica/remover/" + sessionStorage.ID_USUARIO + "/" + idBanco, {
            method: "DELETE"
        })

            .then(function (resposta) {
                if (!resposta.ok) throw new Error("Erro ao remover música.");
                tirarDaTela(card);
            })

            .catch(function (erro) {
                console.log(erro);
            });

    }


    // ATUALIZAR TELA APÓS REMOÇÃO

    function tirarDaTela(card) {

        card.remove();

        if (containerCards.children.length == 0) {
            estadoVazio.style.display = "flex";
        }

    }


    // CARREGAR PLAYLIST DO USUÁRIO

    function carregarPlaylist() {

        const idUsuario = sessionStorage.ID_USUARIO;

        if (!idUsuario) {
            window.location = "login.html";
            return;
        }

        fetch("/musica/listar/" + idUsuario)

            .then(function (resposta) {
                if (!resposta.ok) throw new Error("Erro ao carregar playlist.");
                return resposta.json();
            })

            .then(function (musicas) {

                if (musicas.length > 0) {
                    estadoVazio.style.display = "none";
                }

                for (let i = 0; i < musicas.length; i++) {
                    criarCard(musicas[i], musicas[i].id, musicas[i].genero);
                }

            })

            .catch(function (erro) {
                console.log(erro);
            });

    }


    // INICIAR PÁGINA

    carregarPlaylist();



</script>

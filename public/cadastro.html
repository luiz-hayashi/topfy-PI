<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Topfy</title>
    <link rel="stylesheet" href="style_cadastro.css">
    <script src="./js/sessao.js"></script>
</head>
<body>

    <div class="tela">

        <div class="telabonita_esquerda">

            <div class="textoconheca">Conheça</div>

            <div class="oquevoceouve">O que você ouve</div>
            

            <div class="logo">

                <a href="home.html"><img src="imagens/logotopfywbg.png" alt=""></a>

            </div>



        </div>

        <div class="cadastro_direita">
            
            <p>Seja bem vindo!</p>

            <div class="email">

                <label for="e-mail">E-mail</label>
                <input type="text" id="email_input" placeholder="Digite seu e-mail">

            </div>

            <div class="senha">

                <label for="">Senha</label>
                <input type="password" id="senha_input" placeholder="Digite sua senha">

            </div>

            <div class="senha">

                <label for="">Confirme sua senha:</label>
                <input type="password" id="confirmacao_senha_input" placeholder="Confirme sua senha">

            </div>

            <div class="botao_cadastro">

                <button onclick="cadastrar()">Cadastro</button>

            </div>

            <div class="jaedecasa"><span>Já é de casa? <a href="login.html"><b>Faça seu login!</b></a></span></div>

        </div>

        

    </div>
    
    


</body>
</html>
<script>

  // Array para armazenar usuários cadastrados 
  let usuariosCadastrados = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo

    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    // Verificando se há algum campo em branco
    if (
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
